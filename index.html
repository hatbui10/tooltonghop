<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Công Cụ & Dự Án</title>
    <style>
        :root {
            --primary-glow: rgba(0, 242, 254, 0.3);
            --secondary-glow: rgba(138, 43, 226, 0.3);
            --tertiary-glow: rgba(255, 107, 184, 0.3);
            --bg-primary: #0a0614;
            --bg-secondary: #0f0c1b;
            --bg-card: rgba(22, 16, 38, 0.8);
            --text-primary: #f3f0ff;
            --text-secondary: rgba(243, 240, 255, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-cyan: #00f2fe;
            --accent-purple: #8a2be2;
            --accent-pink: #ff6bb5;
            --accent-gradient: linear-gradient(135deg, #00f2fe, #8a2be2, #ff6bb5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(138, 43, 226, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 242, 254, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 107, 184, 0.1) 0%, transparent 70%);
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(0, 242, 254, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-gradient);
            opacity: 0.3;
            pointer-events: none;
        }

        h1 {
            font-size: 1.75rem;
            text-align: center;
            margin-bottom: 28px;
            color: var(--text-primary);
            font-weight: 600;
            letter-spacing: -0.5px;
            position: relative;
            padding-bottom: 16px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: var(--accent-gradient);
            border-radius: 3px;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        h1 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(33, 25, 56, 0.6);
            color: var(--text-primary);
            text-decoration: none;
            padding: 20px 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            font-weight: 500;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
            will-change: transform, box-shadow, border;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 16px;
            z-index: -1;
        }

        .btn:hover::before {
            opacity: 0.1;
        }

        .btn:hover {
            background: rgba(43, 31, 79, 0.8);
            border-color: var(--accent-cyan);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 
                0 10px 30px rgba(0, 242, 254, 0.2),
                0 0 20px rgba(0, 242, 254, 0.1);
        }

        .btn:active {
            transform: translateY(-2px) scale(0.98);
        }

        .btn .icon {
            font-size: 1.8rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }

        .btn:hover .icon {
            transform: scale(1.2) rotate(5deg);
            text-shadow: 0 0 15px var(--primary-glow);
            animation: pulse-glow 1.5s infinite;
        }

        .btn span:last-child {
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .btn:hover span:last-child {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 5px var(--accent-cyan)); }
            50% { filter: drop-shadow(0 0 15px var(--accent-cyan)); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .container::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 242, 254, 0.05) 0%, transparent 30%),
                radial-gradient(circle at 80% 20%, rgba(138, 43, 226, 0.05) 0%, transparent 30%),
                radial-gradient(circle at 50% 50%, rgba(255, 107, 184, 0.05) 0%, transparent 30%);
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
            z-index: -1;
        }

        /* Floating particles effect */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-cyan);
            border-radius: 50%;
            opacity: 0.4;
            animation: float-particle 15s infinite linear;
        }

        @keyframes float-particle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* Tooltip on hover */
        .btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(10, 6, 20, 0.95);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .btn:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(5px);
        }

        /* Responsive */
        @media (max-width: 450px) {
            body {
                padding: 16px;
            }
            
            .container {
                max-width: calc(100% - 32px);
                padding: 24px 16px;
                border-radius: 20px;
            }
            
            .grid-container {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            
            h1 {
                font-size: 1.5rem;
                margin-bottom: 24px;
            }
            
            .btn {
                padding: 18px 12px;
                border-radius: 14px;
            }
        }

        /* Animation for container */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>
<body>
    <!-- Floating particles -->
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <h1>🚀 <span>Dashboard - Công Cụ & Dự Án</span></h1>
        <div class="grid-container">
            <a href="https://hatbui10.github.io/huongdancss/" class="btn" target="_blank" data-tooltip="Hướng dẫn CSS chi tiết">
                <span class="icon">📚</span>
                <span>Hướng Dẫn CSS</span>
            </a>

            <a href="https://hatbui10.github.io/vscodemini/" class="btn" target="_blank" data-tooltip="VS Code mini - Trình soạn thảo nhẹ">
                <span class="icon">💻</span>
                <span>VS Code Mini</span>
            </a>

            <a href="https://hatbui10.github.io/htmltool/" class="btn" target="_blank" data-tooltip="Công cụ hỗ trợ HTML">
                <span class="icon">🛠️</span>
                <span>HTML Tool</span>
            </a>

            <a href="https://github.com/hatbui10/xeplich" class="btn" target="_blank" data-tooltip="Xếp lịch - Quản lý công việc">
                <span class="icon">📅</span>
                <span>Xếp Lịch</span>
            </a>

            <a href="https://hatbui10.github.io/taofilehtml/" class="btn" target="_blank" data-tooltip="Tạo file HTML nhanh chóng">
                <span class="icon">📄</span>
                <span>Tạo File HTML</span>
            </a>

            <a href="https://hatbui10.github.io/vietcodegongang/" class="btn" target="_blank" data-tooltip="Viết code gọn gàng và chuyên nghiệp">
                <span class="icon">🎨</span>
                <span>Viết Code Gọn Gàng</span>
            </a>

            <a href="https://hatbui10.github.io/baomatfile/" class="btn" target="_blank" data-tooltip="Bảo mật file và dữ liệu">
                <span class="icon">🔒</span>
                <span>Bảo Mật File</span>
            </a>

            <a href="https://hatbui10.github.io/taotaikhoan/" class="btn" target="_blank" data-tooltip="Tạo tài khoản nhanh chóng">
                <span class="icon">👤</span>
                <span>Tạo Tài Khoản</span>
            </a>

            <a href="https://seostudio.tools/vi" class="btn" target="_blank" data-tooltip="Tool AI tổng hợp - SEO Studio">
                <span class="icon">🤖</span>
                <span>Tool AI Tổng Hợp</span>
            </a>

            <a href="https://hatbui10.github.io/200css/" class="btn" target="_blank" data-tooltip="200 hiệu ứng CSS thường dùng">
                <span class="icon">✨</span>
                <span>200 Hiệu Ứng CSS</span>
            </a>

            <a href="https://arena.ai/agent" class="btn" target="_blank" data-tooltip="AI viết code thông minh">
                <span class="icon">🤖</span>
                <span>AI Viết Code</span>
            </a>

            <a href="https://hatbui10.github.io/tooltaoweb/" class="btn" target="_blank" data-tooltip="Tạo website chuyên nghiệp">
                <span class="icon">🌐</span>
                <span>Tạo Website</span>
            </a>
        </div>
    </div>

    <script>
        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 30;
        const colors = ['#00f2fe', '#8a2be2', '#ff6bb5'];

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particle.style.width = (Math.random() * 4 + 2) + 'px';
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }

        // Add click effect
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                
                // Create ripple effect
                const ripple = document.createElement('div');
                ripple.style.position = 'fixed';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.width = '0';
                ripple.style.height = '0';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(0, 242, 254, 0.3)';
                ripple.style.pointerEvents = 'none';
                ripple.style.zIndex = '9999';
                ripple.style.transform = 'translate(-50%, -50%)';
                ripple.style.transition = 'width 0.6s ease, height 0.6s ease, opacity 0.6s ease';
                document.body.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.style.width = '300px';
                    ripple.style.height = '300px';
                    ripple.style.opacity = '0';
                }, 10);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });

        // Add intersection observer for fade in animation
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        document.querySelectorAll('.btn').forEach((btn, index) => {
            btn.style.opacity = '0';
            btn.style.transform = 'translateY(20px)';
            btn.style.transition = `opacity 0.4s ease ${index * 0.1}s, transform 0.4s ease ${index * 0.1}s`;
            observer.observe(btn);
        });
    </script>
</body>
</html>
