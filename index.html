<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Công Cụ & Dự Án - Siêu Mượt</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #161026;
            --text-color: #f3f0ff;
            --border-color: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 
                        0 0 20px rgba(0, 242, 254, 0.15);
            /* Tăng tốc phần cứng GPU giúp cuộn mượt mà */
            transform: translateZ(0);
            will-change: transform;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 14px;
            text-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
            letter-spacing: 0.5px;
        }

        /* Thiết lập dạng lưới (Grid) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #211938;
            color: #ffffff;
            text-decoration: none;
            padding: 18px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.92rem;
            font-weight: 500;
            gap: 8px;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            transform: translateZ(0);
            will-change: transform;
        }

        .btn:hover {
            background-color: #2b1f4f;
            border-color: #00f2fe;
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .btn .icon {
            font-size: 1.6rem;
            transition: transform 0.2s ease;
        }

        .btn:hover .icon {
            transform: scale(1.15);
        }

        /* Thích ứng màn hình nhỏ */
        @media (max-width: 400px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 Danh Sách Dự Án & Công Cụ</h1>
        <div class="grid-container">
            <a href="https://hatbui10.github.io/huongdancss/" class="btn" target="_blank">
                <span class="icon">📚</span>
                <span>Hướng Dẫn CSS</span>
            </a>

            <a href="https://hatbui10.github.io/vscodemini/" class="btn" target="_blank">
                <span class="icon">💻</span>
                <span>VS code mini</span>
            </a>

            <a href="https://hatbui10.github.io/htmltool/" class="btn" target="_blank">
                <span class="icon">🛠️</span>
                <span>Html tool</span>
            </a>

            <a href="https://github.com/hatbui10/xeplich" class="btn" target="_blank">
                <span class="icon">📂</span>
                <span>GitHub Xếp Lịch</span>
            </a>

            <a href="https://hatbui10.github.io/taofilehtml/" class="btn" target="_blank">
                <span class="icon">📄</span>
                <span>Tạo File HTML</span>
            </a>

            <a href="https://hatbui10.github.io/vietcodegongang/" class="btn" target="_blank">
                <span class="icon">📄</span>
                <span>Viết code gọn gàng</span>
            </a>

            <a href="https://hatbui10.github.io/baomatfile/" class="btn" target="_blank">
                <span class="icon">🔒</span>
                <span>Bảo Mật File</span>
            </a>

            <a href="https://hatbui10.github.io/taotaikhoan/" class="btn" target="_blank">
                <span class="icon">👤</span>
                <span>Tạo Tài Khoản</span>
            </a>

            <a href="https://hatbui10.github.io/tooltaoweb/" class="btn" target="_blank">
                <span class="icon">🌍</span>
                <span>Tạo Tài Khoản</span>
            </a>





        </div>
    </div>

</body>
</html>
